name: Tests

on:
  push:
    branches: [main, production]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.database }})
    # Runs on the self-hosted Jogger pool "zerrors-linux-x64" (https://jogger.adieu.ovh).
    runs-on: [self-hosted, linux, x64]

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Only started usefully for the pgsql leg; harmless for sqlite.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zerrors_test
          POSTGRES_USER: zerrors
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerrors -d zerrors_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, pdo_pgsql, redis
          coverage: none

      - name: Copy .env
        run: cp .env.example .env

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check for security advisories
        run: composer audit

      - name: Check code style (Pint)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        if: matrix.database == 'sqlite'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests (SQLite)
        if: matrix.database == 'sqlite'
        run: php artisan test --compact

      # phpunit.xml sets DB_* with plain <env> (no force="true"), so real
      # environment variables take precedence over it.
      - name: Run tests (PostgreSQL)
        if: matrix.database == 'pgsql'
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: zerrors_test
          DB_USERNAME: zerrors
          DB_PASSWORD: secret
        run: php artisan test --compact
